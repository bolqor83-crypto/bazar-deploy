name: Проверка качества

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить pnpm
        uses: pnpm/action-setup@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установить зависимости
        run: pnpm install --frozen-lockfile

      - name: lint + typecheck + test
        run: pnpm turbo lint typecheck test --concurrency=2

  e2e:
    name: e2e на PostgreSQL (Neon)
    needs: quality
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      NEON_DATABASE_URL_DIRECT: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
      NEON_DATABASE_URL_POOLED: ${{ secrets.NEON_DATABASE_URL_POOLED }}
      JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить pnpm
        uses: pnpm/action-setup@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установить зависимости
        run: pnpm install --frozen-lockfile

      - name: e2e API (тестовая БД bazar_test)
        run: pnpm --filter api test:e2e

  visual-regression:
    name: pixelmatch golden (tolerance 0.5%)
    needs: quality
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      EXPO_NO_TELEMETRY: '1'
      NEON_DATABASE_URL_DIRECT: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
      NEON_DATABASE_URL_POOLED: ${{ secrets.NEON_DATABASE_URL_POOLED }}
      JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить pnpm
        uses: pnpm/action-setup@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установить зависимости
        run: pnpm install --frozen-lockfile

      - name: Установить Chromium для Playwright
        run: pnpm exec playwright install chromium --with-deps

      - name: Собрать статику mobile
        run: pnpm --filter mobile exec expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: /api

      - name: Собрать API
        run: pnpm --filter api build

      - name: Поднять backend + статику на :3000
        run: |
          cd apps/api
          {
            echo "PORT=3000"
            echo "NODE_ENV=production"
            echo "DATABASE_URL_POOLED=$NEON_DATABASE_URL_POOLED"
            echo "DATABASE_URL_DIRECT=$NEON_DATABASE_URL_DIRECT"
            echo "JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET"
            echo "JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET"
            echo "CORS_ORIGINS="
            echo "THROTTLER_DISABLED=false"
            echo "MOBILE_DIST_PATH=$GITHUB_WORKSPACE/apps/mobile/dist"
          } > .env.ci
          node --env-file=.env.ci dist/src/main.js &
          for i in $(seq 1 30); do
            curl -s --max-time 2 http://localhost:3000/api/health | grep -q '"ok"' && break
            sleep 2
          done
          curl -s http://localhost:3000/api/health

      - name: Pixelmatch golden (tolerance 0.5%)
        run: pnpm test:visual

      - name: Загрузить diff-артефакты (при падении)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pixelmatch-diff
          path: download/pixelmatch-diff/
          if-no-files-found: ignore

  deploy-to-render:
    name: Деплой на Render
    needs: [quality, e2e, visual-regression]
    # Не блокирует merge: job последний, ничего от него не зависит.
    # Деплоим только main после пуша; PR-сборки не триггерят прод.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Render не имеет GitHub-коннекта к приватному bazar — деплой
      # идёт из публичного зеркала bazar-deploy (решение Промта 10,
      # ADR 0011). Зеркало синхронизируется перед каждым деплоем.
      - name: Синхронизировать зеркало bazar-deploy
        run: |
          git remote add mirror https://x-access-token:${{ secrets.MIRROR_PAT }}@github.com/bolqor83-crypto/bazar-deploy.git
          git push mirror HEAD:main

      - name: Триггер деплоя через Render API
        run: |
          response=$(curl -s --max-time 30 -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json")
          echo "$response" | head -c 200
          echo "$response" | grep -q '"id"' || {
            echo "::warning::Render deploy не запущен — проверь секреты RENDER_SERVICE_ID/RENDER_API_KEY"
            exit 1
          }
